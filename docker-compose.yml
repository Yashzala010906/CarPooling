services:
  postgres:
    image: postgres:16-alpine
    container_name: carpool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carpool
      POSTGRES_PASSWORD: carpool
      POSTGRES_DB: carpool
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carpool']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: carpool-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://carpool:carpool@postgres:5432/carpool?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: docker-dev-access-secret
      JWT_REFRESH_SECRET: docker-dev-refresh-secret
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: carpool-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
